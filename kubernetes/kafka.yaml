apiVersion: apps/v1
kind: Deployment
metadata:
  name: zookeeper
  namespace: shift-scheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zookeeper
  template:
    metadata:
      labels:
        app: zookeeper
    spec:
      containers:
      - name: zookeeper
        image: wurstmeister/zookeeper
        ports:
        - containerPort: 2181
---
apiVersion: v1
kind: Service
metadata:
  name: zookeeper-service
  namespace: shift-scheduling
spec:
  selector:
    app: zookeeper
  ports:
  - port: 2181
    targetPort: 2181
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: shift-scheduling
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka
  template:
    metadata:
      labels:
        app: kafka
    spec:
      containers:
      - name: kafka
        image: wurstmeister/kafka
        ports:
        - containerPort: 9092
        env:
        - name: KAFKA_ADVERTISED_HOST_NAME
          value: kafka-service
        - name: KAFKA_ZOOKEEPER_CONNECT
          value: zookeeper-service:2181
        - name: KAFKA_CREATE_TOPICS
          value: "alerts:1:1,employee-topic:1:1,job-planning-topic:1:1,alerte-msg-topic:1:1"
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-service
  namespace: shift-scheduling
spec:
  selector:
    app: kafka
  ports:
  - port: 9092
    targetPort: 9092

