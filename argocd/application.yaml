apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: shift-scheduling
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/malakaydi/Shift-Scheduling-Project-master-DevOps.git
    targetRevision: HEAD
    path: helm/shift-scheduling
  destination:
    server: https://kubernetes.default.svc
    namespace: shift-scheduling
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true