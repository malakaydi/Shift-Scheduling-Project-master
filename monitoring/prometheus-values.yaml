server:
  persistentVolume:
    size: 10Gi
  
alertmanager:
  persistentVolume:
    size: 2Gi

nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true

pushgateway:
  enabled: true

serverFiles:
  prometheus.yml:
    scrape_configs:
      - job_name: 'shift-scheduling-services'
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_label_app]
            action: keep
            regex: (api-gateway|employee-service|job-planning-service|alertes-service)