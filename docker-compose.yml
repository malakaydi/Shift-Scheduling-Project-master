version: '3.8'

services:
  zookeeper:
    image: wurstmeister/zookeeper
    ports:
      - "2181:2181"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "echo srvr | nc localhost 2181 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: wurstmeister/kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CREATE_TOPICS: "alerts:1:1,employee-topic:1:1,job-planning-topic:1:1,alerte-msg-topic:1:1"
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_BROKER_ID: 1
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    depends_on:
      zookeeper:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --list --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - app-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 40s

  
  
  alertes:
    build: ./Alertes
    ports:
      - "50055:50055"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/alerteMsgsDB
      - KAFKA_BROKER=kafka:9092
      - NODE_ENV=production
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  api-gateway:
    build:
      context: ./ApiGateway
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017
      - ALERTES_SERVICE=alertes:50051
      - EMPLOYEE_SERVICE=employee:50053
      - JOBPLANNING_SERVICE=jobplanning:50052
      - KAFKA_BROKER=kafka:9092
      - NODE_ENV=production
    depends_on:
      mongodb:
        condition: service_healthy
      kafka:
        condition: service_healthy
      alertes:
        condition: service_started
      employee:
        condition: service_started
      jobplanning:
        condition: service_started
    networks:
      - app-network
    restart: on-failure

  employee:
    build: ./Employee
    ports:
      - "50053:50053"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/employeesDB
      - KAFKA_BROKER=kafka:9092
      - NODE_ENV=production
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

  jobplanning:
    image: ${DOCKER_REGISTRY}/jobplanning:${VERSION}
    build: ./JobPlanning
    ports:
      - "50052:50052"
    environment:
      - MONGODB_URL=mongodb://mongodb:27017/jobPlanningDB
      - KAFKA_BROKER=kafka:9092
      - NODE_ENV=production
    depends_on:
      kafka:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    networks:
      - app-network
    restart: on-failure

networks:
  app-network:
    driver: bridge

volumes:
  mongodb_data:
  jenkins_home: